<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="tab-title">Portal Media</title>
    <link id="tab-icon" rel="icon" type="image/x-icon" href="https://www.google.com/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: white; }
        .card:hover { transform: translateY(-5px); transition: 0.3s; }
    </style>
</head>
<body class="p-8">

    <header class="max-w-4xl mx-auto text-center mb-12">
        <h1 class="text-4xl font-bold mb-4">Chrome Hub Clone</h1>
        <p class="text-gray-400 mb-6">Akses aplikasi favorit tanpa hambatan.</p>
        <input type="text" placeholder="Cari aplikasi atau URL..." 
               class="w-full p-4 rounded-lg bg-slate-800 border border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
    </header>

    <main class="max-w-6xl mx-auto grid grid-cols-2 md:grid-cols-4 gap-6">
        
        <div class="card bg-slate-800 p-4 rounded-xl text-center cursor-pointer shadow-lg" onclick="launchApp('https://www.google.com')">
            <div class="w-16 h-16 bg-blue-600 rounded-full mx-auto mb-4 flex items-center justify-center text-2xl">G</div>
            <h3 class="font-semibold">Google Proxy</h3>
        </div>

        <div class="card bg-slate-800 p-4 rounded-xl text-center cursor-pointer shadow-lg" onclick="launchApp('https://discord.com')">
            <div class="w-16 h-16 bg-indigo-600 rounded-full mx-auto mb-4 flex items-center justify-center text-2xl">D</div>
            <h3 class="font-semibold">Discord</h3>
        </div>

        <div class="card bg-slate-800 p-4 rounded-xl text-center cursor-pointer shadow-lg">
            <div class="w-16 h-16 bg-red-600 rounded-full mx-auto mb-4 flex items-center justify-center text-2xl">🎮</div>
            <h3 class="font-semibold">Minecraft Web</h3>
        </div>

    </main>

    <script>
        // Fungsi Tab Cloaking (Menyamarkan tab saat pindah fokus)
        window.onblur = function () {
            document.getElementById('tab-title').innerText = 'Google Drive';
            document.getElementById('tab-icon').href = 'https://ssl.gstatic.com/docs/doclist/images/drive_2022q3_32dp.png';
        };
        window.onfocus = function () {
            document.getElementById('tab-title').innerText = 'Portal Media';
            document.getElementById('tab-icon').href = 'https://www.google.com/favicon.ico';
        };

        // Fungsi untuk membuka aplikasi (nanti dihubungkan ke proxy)
        function launchApp(url) {
            alert("Membuka: " + url + "\n(Di sini Anda perlu menghubungkan backend Proxy seperti Ultraviolet)");
        }
    </script>
</body>
</html>
